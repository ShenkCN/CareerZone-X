<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  .tank { position:relative; border-radius:20px; overflow:hidden; background:radial-gradient(circle at 20% 10%, #2f5752 0%, #203a38 58%, #172b2a 100%); color:#eefdfa; font-family:"Segoe UI","Microsoft YaHei",sans-serif; padding:12px 14px 10px; box-shadow:inset 0 0 60px rgba(0,0,0,.25); }
  .bubble { position:absolute; border:1px solid rgba(204,251,241,.35); border-radius:50%; animation:rise linear infinite; }
  @keyframes rise { from { transform:translateY(20px); opacity:.15; } to { transform:translateY(-240px); opacity:.7; } }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:2; }
  .title { font-weight:800; letter-spacing:.3px; }
  .title small { display:block; font-weight:400; color:#99f6e4; font-size:10px; margin-top:2px; }
  .mood { font-size:11px; color:#ccfbf1; white-space:nowrap; }
  .stage { display:flex; gap:12px; align-items:center; margin-top:4px; position:relative; z-index:2; }
  .fish-wrap { width:150px; min-width:150px; cursor:pointer; user-select:none; transition:transform .15s ease; }
  .fish-wrap:active { transform:scale(.96); }
  .fish-wrap svg { width:100%; height:auto; display:block; filter:drop-shadow(0 10px 18px rgba(0,0,0,.22)); }
  .speech { flex:1; min-height:48px; background:rgba(255,255,255,.10); border:1px solid rgba(204,251,241,.22); border-radius:13px; padding:8px 10px; font-size:12px; line-height:1.45; color:#f0fdfa; }
  .speech b { color:#fbbf24; }
  .buttons { display:flex; gap:7px; margin-top:6px; flex-wrap:wrap; }
  button { border:1px solid rgba(204,251,241,.25); background:rgba(255,255,255,.10); color:#fff; border-radius:9px; padding:6px 10px; cursor:pointer; font-size:11px; transition:background .15s; }
  button:hover { background:rgba(255,255,255,.22); }
  button.primary { background:#b5654a; border-color:#b5654a; font-weight:700; }
  button.primary:hover { background:#9f543d; }
  button.dark { background:rgba(0,0,0,.20); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .tabs { display:flex; gap:6px; margin-top:8px; position:relative; z-index:2; flex-wrap:wrap; }
  .tabs button.active { background:#d9e6df; color:#203a38; border-color:#d9e6df; font-weight:800; }
  .panel { display:none; margin-top:6px; position:relative; z-index:2; }
  .panel.active { display:block; }
  .hint { font-size:10px; color:#99f6e4; margin:2px 0 5px; line-height:1.4; }
  canvas { width:100%; height:210px; border-radius:11px; background:rgba(0,0,0,.16); border:1px solid rgba(204,251,241,.16); touch-action:manipulation; display:block; }
  .game-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .feedback { font-size:11px; margin-top:6px; color:#fde68a; min-height:16px; }
  .guess-row { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .guess-row input { width:88px; padding:6px 8px; border-radius:8px; border:1px solid rgba(204,251,241,.3); background:rgba(0,0,0,.18); color:#fff; }
  .pad { display:grid; grid-template-columns:repeat(3,42px); grid-template-rows:repeat(2,32px); gap:5px; margin-top:6px; }
  .pad button { padding:4px; font-size:14px; }
  .pad .up { grid-column:2; }
  .pad .left { grid-column:1; grid-row:2; }
  .pad .down { grid-column:2; grid-row:2; }
  .pad .right { grid-column:3; grid-row:2; }
  @media (max-width:560px) {
    .stage { gap:8px; }
    .fish-wrap { width:116px; min-width:116px; }
    .speech { font-size:11px; min-height:44px; }
    canvas { height:190px; }
  }
</style>
</head>
<body>
<div class="tank" id="tank">
  <div class="bubble" style="width:7px;height:7px;left:12%;bottom:-10px;animation-duration:7s;"></div>
  <div class="bubble" style="width:5px;height:5px;left:48%;bottom:-10px;animation-duration:9s;animation-delay:2s;"></div>
  <div class="bubble" style="width:9px;height:9px;left:78%;bottom:-10px;animation-duration:8s;animation-delay:1s;"></div>

  <div class="top">
    <div class="title">Deepseek 大肥鱼<small>CareerZone X 看门鱼 · 本地小游戏</small></div>
    <div class="mood" id="mood">心情 80 / 100</div>
  </div>

  <div class="stage">
    <div class="fish-wrap" id="fish" title="摸摸鱼">
      <svg viewBox="0 0 220 150" role="img" aria-label="一条胖胖的 Deepseek 鱼">
        <defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a7c9c0"/><stop offset=".55" stop-color="#6fa79d"/><stop offset="1" stop-color="#3f6f6a"/></linearGradient></defs>
        <path d="M38 75 C10 48, 8 100, 38 78 Z" fill="#2f625c" opacity=".95"/>
        <ellipse cx="112" cy="75" rx="78" ry="48" fill="url(#body)"/>
        <ellipse cx="118" cy="92" rx="52" ry="24" fill="#ccfbf1" opacity=".55"/>
        <path d="M100 32 C120 8, 148 12, 156 38 C138 30, 118 32, 100 32 Z" fill="#3f6f6a"/>
        <path d="M105 118 C118 138, 142 136, 150 116 C136 121, 120 120, 105 118 Z" fill="#2f5752"/>
        <circle cx="163" cy="65" r="13" fill="#fff"/><circle cx="166" cy="66" r="7" fill="#0f172a"/><circle cx="169" cy="63" r="2.4" fill="#fff"/>
        <ellipse cx="150" cy="88" rx="12" ry="6" fill="#fb7185" opacity=".55"/>
        <path d="M178 84 Q188 90 178 95" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M75 60 q12 10 0 20 M92 54 q12 10 0 20 M60 72 q10 8 0 16" stroke="#ecfeff" stroke-width="2" fill="none" opacity=".35"/>
      </svg>
    </div>
    <div class="speech" id="speech">你好，我是看门鱼。<b>先注册，再等 Shenk 批准</b>。等审核的时候，可以喂我、接鱼、猜数字，或者来一局贪吃蛇。</div>
  </div>

  <div class="buttons">
    <button class="primary" id="feed">喂一口</button>
    <button id="pet">摸摸头</button>
    <button id="joke">说句真话</button>
    <button id="status">汇报成绩</button>
  </div>

  <div class="tabs">
    <button class="active" data-panel="catchPanel">🎣 接鱼 20 秒</button>
    <button data-panel="guessPanel">🔢 猜数字</button>
    <button data-panel="snakePanel">🐍 贪吃蛇</button>
  </div>

  <div class="panel active" id="catchPanel">
    <div class="hint">20 秒内点击/触摸鱼得分，不再因为漏鱼结束。蓝鱼 1 分、红鱼 3 分、小海马 5 分；石头 0 分、鱼雷 -3 分。障碍随得分变多。</div>
    <canvas id="catchCanvas" width="640" height="210"></canvas>
    <div class="game-row"><button id="startCatch">开始接鱼</button><span class="feedback" id="catchFeedback">点“开始接鱼”再玩。</span></div>
  </div>

  <div class="panel" id="guessPanel">
    <div class="hint">我想了一个 1—100 的整数，你有 10 次机会。</div>
    <div class="guess-row"><input id="guessInput" type="number" min="1" max="100" placeholder="1-100" /><button id="guessBtn">猜</button><button class="dark" id="resetGuess">重开</button></div>
    <div class="feedback" id="guessFeedback">等待你的第一猜。</div>
  </div>

  <div class="panel" id="snakePanel">
    <div class="hint">方向键/WASD 或下面按钮控制；吃到 🍎 加 1 分，撞墙或撞到自己结束。</div>
    <canvas id="snakeCanvas" width="640" height="210"></canvas>
    <div class="game-row"><button id="startSnake">开始贪吃蛇</button><span class="feedback" id="snakeFeedback">点“开始贪吃蛇”再玩。</span></div>
    <div class="pad"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div>
  </div>
</div>

<script>
// 所有状态只存在浏览器内存；不写 localStorage，不发网络请求。
const state = {
  mood: 80,
  activePanel: "catchPanel",
  catchScore: 0,
  catchRunning: false,
  catchStart: 0,
  catchItems: [],
  catchSpawnAt: 0,
  catchLast: 0,
  catchFloat: [],
  guessTarget: Math.floor(Math.random() * 100) + 1,
  guessLeft: 10,
  snake: [],
  snakeDir: { x: 1, y: 0 },
  snakeFood: { x: 8, y: 4 },
  snakeScore: 0,
  snakeRunning: false,
  snakeLast: 0,
  snakeStep: 150,
  lastCatchResult: "",
  lastGuessResult: "",
  lastSnakeResult: "",
};
const speech = document.getElementById("speech");
const moodEl = document.getElementById("mood");
const catchCanvas = document.getElementById("catchCanvas");
const catchCtx = catchCanvas.getContext("2d");
const snakeCanvas = document.getElementById("snakeCanvas");
const snakeCtx = snakeCanvas.getContext("2d");

function setMood(delta, text) {
  state.mood = Math.max(0, Math.min(100, state.mood + delta));
  moodEl.textContent = "心情 " + state.mood + " / 100";
  if (text) speech.innerHTML = text;
  document.getElementById("fish").style.transform = state.mood < 30 ? "rotate(-3deg)" : "none";
}

function setFeedback(id, text) { document.getElementById(id).textContent = text; }

document.getElementById("feed").addEventListener("click", () => {
  if (state.mood >= 96) setMood(-2, "吃不下了…… <b>再喂就变成球了</b>。去投个简历吧。");
  else setMood(12, "谢谢！<b>DeepSeek 的 token 不能吃，但你的简历可以。</b>");
});
document.getElementById("pet").addEventListener("click", () => {
  const lines = [
    "别摸了，<b>岗位不会自己游进收藏夹</b>。",
    "我今天已经游了 2000 米，你呢？",
    "提示：<b>先填目标岗位，AI 才知道帮你找什么</b>。",
    "BOSS 的已读不回，不是你的问题；<b>是筛选器的问题</b>。",
    "如果焦虑，就先投一家；<b>行动比完美简历有用</b>。",
  ];
  setMood(5, lines[Math.floor(Math.random() * lines.length)]);
});
document.getElementById("joke").addEventListener("click", () => {
  setMood(0, "真话：<b>我不会自动登录/翻页/破解验证码</b>。你打开页面点采集，我负责分析和整理。");
});
document.getElementById("status").addEventListener("click", () => {
  setMood(2, "接鱼 " + (state.lastCatchResult || "还没玩") + "；猜数字 " + (state.lastGuessResult || "还没玩") + "；贪吃蛇 " + (state.lastSnakeResult || "还没玩") + "。");
});
document.getElementById("fish").addEventListener("click", () => setMood(4, "咕噜。"));

document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    if (state.catchRunning) endCatch("切换游戏，提前结束");
    if (state.snakeRunning) endSnake("切换游戏，提前结束");
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.panel).classList.add("active");
    state.activePanel = btn.dataset.panel;
  });
});

// ---------------- 接鱼 ----------------
function weightedType() {
  const r = Math.random();
  if (r < 0.60) return "blue";
  if (r < 0.85) return "red";
  return "seahorse";
}

function spawnCatchItem() {
  const obstacleChance = 0.15 + Math.min(0.15, state.catchScore / 200 * 0.15);
  if (Math.random() < obstacleChance) {
    const kind = Math.random() < 0.5 ? "rock" : "torpedo";
    state.catchItems.push({ kind, x: 30 + Math.random() * 580, y: -28, speed: 48 + Math.random() * 20, size: 25, alive: true });
    return;
  }
  const kind = weightedType();
  const blue = kind === "blue", red = kind === "red";
  state.catchItems.push({
    kind,
    x: 30 + Math.random() * 580,
    y: -34,
    speed: blue ? 38 + Math.random() * 18 : (red ? 52 + Math.random() * 20 : 82 + Math.random() * 25),
    size: blue ? 36 : (red ? 27 : 18),
    alive: true,
  });
}

function drawSeahorse(x, y, size) {
  catchCtx.save();
  catchCtx.translate(x, y);
  catchCtx.scale(size / 20, size / 20);
  catchCtx.fillStyle = "#fbbf24";
  catchCtx.beginPath();
  catchCtx.ellipse(0, 0, 6, 10, 0, 0, Math.PI * 2);
  catchCtx.fill();
  catchCtx.beginPath();
  catchCtx.arc(4, -9, 5, 0, Math.PI * 2);
  catchCtx.fill();
  catchCtx.beginPath();
  catchCtx.moveTo(8, -10);
  catchCtx.lineTo(15, -7);
  catchCtx.lineTo(8, -5);
  catchCtx.closePath();
  catchCtx.fill();
  catchCtx.strokeStyle = "#fbbf24";
  catchCtx.lineWidth = 2;
  catchCtx.beginPath();
  catchCtx.arc(-2, 12, 5, 0.2, Math.PI * 1.6);
  catchCtx.stroke();
  catchCtx.fillStyle = "#0f172a";
  catchCtx.beginPath();
  catchCtx.arc(6, -10, 1.2, 0, Math.PI * 2);
  catchCtx.fill();
  catchCtx.restore();
}

function drawCatch() {
  catchCtx.clearRect(0, 0, catchCanvas.width, catchCanvas.height);
  catchCtx.strokeStyle = "rgba(204,251,241,.10)";
  catchCtx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    catchCtx.beginPath();
    catchCtx.arc(80 + i * 130, 30 + (i % 2) * 18, 60, 0, Math.PI * 2);
    catchCtx.stroke();
  }
  catchCtx.textAlign = "center";
  catchCtx.textBaseline = "middle";
  for (const item of state.catchItems) {
    if (!item.alive) continue;
    if (item.kind === "blue") { catchCtx.font = "36px serif"; catchCtx.fillText("🐟", item.x, item.y); }
    else if (item.kind === "red") { catchCtx.font = "27px serif"; catchCtx.fillText("🐠", item.x, item.y); }
    else if (item.kind === "seahorse") { drawSeahorse(item.x, item.y, 18); }
    else if (item.kind === "rock") {
      catchCtx.fillStyle = "#94a3b8";
      catchCtx.beginPath();
      catchCtx.moveTo(item.x - 14, item.y + 12);
      catchCtx.lineTo(item.x - 17, item.y - 2);
      catchCtx.lineTo(item.x - 6, item.y - 14);
      catchCtx.lineTo(item.x + 11, item.y - 9);
      catchCtx.lineTo(item.x + 16, item.y + 6);
      catchCtx.lineTo(item.x + 5, item.y + 15);
      catchCtx.closePath();
      catchCtx.fill();
    } else {
      catchCtx.fillStyle = "#ef4444";
      catchCtx.beginPath();
      catchCtx.ellipse(item.x, item.y, 9, 16, 0.2, 0, Math.PI * 2);
      catchCtx.fill();
      catchCtx.fillStyle = "#fecaca";
      catchCtx.beginPath();
      catchCtx.moveTo(item.x + 7, item.y - 10);
      catchCtx.lineTo(item.x + 16, item.y - 16);
      catchCtx.lineTo(item.x + 14, item.y - 4);
      catchCtx.closePath();
      catchCtx.fill();
    }
  }
  for (const text of state.catchFloat) {
    catchCtx.fillStyle = text.color;
    catchCtx.font = "bold 14px 'Segoe UI', sans-serif";
    catchCtx.fillText(text.text, text.x, text.y);
  }
  catchCtx.fillStyle = "rgba(255,255,255,.9)";
  catchCtx.font = "13px 'Segoe UI', sans-serif";
  catchCtx.textAlign = "left";
  catchCtx.textBaseline = "alphabetic";
  const remain = state.catchRunning ? Math.max(0, 20 - (performance.now() - state.catchStart) / 1000) : 20;
  catchCtx.fillText("得分 " + state.catchScore + " · 剩余 " + remain.toFixed(1) + " 秒", 10, 20);
}

function catchLoop(now) {
  if (!state.catchRunning) return;
  if (!state.catchLast) state.catchLast = now;
  const dt = Math.min(0.05, (now - state.catchLast) / 1000);
  state.catchLast = now;
  if (now - state.catchSpawnAt > 520) {
    state.catchSpawnAt = now;
    spawnCatchItem();
  }
  for (const item of state.catchItems) {
    item.y += item.speed * dt;
    if (item.y > catchCanvas.height + 30) item.alive = false;
  }
  state.catchItems = state.catchItems.filter((item) => item.alive && item.y < catchCanvas.height + 30);
  for (const text of state.catchFloat) { text.y -= 24 * dt; text.life -= dt; }
  state.catchFloat = state.catchFloat.filter((text) => text.life > 0);
  drawCatch();
  if (now - state.catchStart >= 20000) { endCatch("20 秒时间到"); return; }
  requestAnimationFrame(catchLoop);
}

function startCatch() {
  if (state.catchRunning) return;
  state.catchScore = 0;
  state.catchItems = [];
  state.catchFloat = [];
  state.catchRunning = true;
  state.catchStart = performance.now();
  state.catchSpawnAt = state.catchStart;
  state.catchLast = 0;
  document.getElementById("startCatch").disabled = true;
  setFeedback("catchFeedback", "开接！蓝鱼 1 分，红鱼 3 分，海马 5 分；小心石头和鱼雷。");
  requestAnimationFrame(catchLoop);
}

function endCatch(reason) {
  if (!state.catchRunning) return;
  state.catchRunning = false;
  document.getElementById("startCatch").disabled = false;
  document.getElementById("startCatch").textContent = "再玩一局";
  state.lastCatchResult = state.catchScore + " 分";
  setFeedback("catchFeedback", reason + "：本局 " + state.catchScore + " 分。");
  setMood(6, "我看你接了 <b>" + state.catchScore + " 分</b>。手速不错，投简历也要这个速度。");
  drawCatch();
}

catchCanvas.addEventListener("pointerdown", (event) => {
  if (!state.catchRunning) return;
  const rect = catchCanvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * catchCanvas.width / rect.width;
  const y = (event.clientY - rect.top) * catchCanvas.height / rect.height;
  for (let i = state.catchItems.length - 1; i >= 0; i--) {
    const item = state.catchItems[i];
    if (!item.alive) continue;
    const radius = item.size * 0.75;
    if (Math.abs(x - item.x) <= radius && Math.abs(y - item.y) <= radius) {
      item.alive = false;
      if (item.kind === "blue") { state.catchScore += 1; state.catchFloat.push({ x: item.x, y: item.y, text: "+1", color: "#99f6e4", life: 0.7 }); }
      else if (item.kind === "red") { state.catchScore += 3; state.catchFloat.push({ x: item.x, y: item.y, text: "+3", color: "#fca5a5", life: 0.7 }); }
      else if (item.kind === "seahorse") { state.catchScore += 5; state.catchFloat.push({ x: item.x, y: item.y, text: "+5", color: "#fbbf24", life: 0.7 }); }
      else if (item.kind === "torpedo") { state.catchScore = Math.max(0, state.catchScore - 3); state.catchFloat.push({ x: item.x, y: item.y, text: "-3", color: "#ef4444", life: 0.7 }); }
      else { state.catchFloat.push({ x: item.x, y: item.y, text: "0", color: "#cbd5e1", life: 0.6 }); }
      break;
    }
  }
});
document.getElementById("startCatch").addEventListener("click", startCatch);

// ---------------- 猜数字 ----------------
function resetGuess() {
  state.guessTarget = Math.floor(Math.random() * 100) + 1;
  state.guessLeft = 10;
  document.getElementById("guessInput").value = "";
  setFeedback("guessFeedback", "已经重开。1—100，10 次机会。");
}
document.getElementById("resetGuess").addEventListener("click", resetGuess);
document.getElementById("guessBtn").addEventListener("click", () => {
  const value = Number(document.getElementById("guessInput").value);
  if (!Number.isInteger(value) || value < 1 || value > 100) { setFeedback("guessFeedback", "请输入 1—100 的整数。"); return; }
  if (state.guessLeft <= 0) { setFeedback("guessFeedback", "次数用完了，点“重开”再来。"); return; }
  state.guessLeft -= 1;
  if (value === state.guessTarget) {
    setFeedback("guessFeedback", "中了！答案就是 " + value + "，剩余 " + state.guessLeft + " 次。");
    state.lastGuessResult = "猜中了（剩 " + state.guessLeft + " 次）";
    setMood(8, "猜中了！<b>直觉</b>有时候比海投更准。");
    state.guessLeft = 0;
  } else if (value < state.guessTarget) {
    setFeedback("guessFeedback", "小了。还剩 " + state.guessLeft + " 次。");
  } else {
    setFeedback("guessFeedback", "大了。还剩 " + state.guessLeft + " 次。");
  }
  if (state.guessLeft === 0 && value !== state.guessTarget) {
    setFeedback("guessFeedback", "次数用完了，答案是 " + state.guessTarget + "。点“重开”再来。");
    state.lastGuessResult = "没猜中，答案 " + state.guessTarget;
    setMood(-2, "没猜中也没关系，<b>下一局重新开始</b>。");
  }
});

// ---------------- 贪吃蛇 ----------------
function snakeReset() {
  state.snake = [{ x: 8, y: 5 }, { x: 7, y: 5 }, { x: 6, y: 5 }];
  state.snakeDir = { x: 1, y: 0 };
  state.snakeFood = { x: 15, y: 5 };
  state.snakeScore = 0;
  state.snakeLast = 0;
  drawSnake();
}
function drawSnake() {
  snakeCtx.clearRect(0, 0, snakeCanvas.width, snakeCanvas.height);
  const cols = 32, rows = 10, cell = 20;
  snakeCtx.strokeStyle = "rgba(204,251,241,.08)";
  for (let x = 0; x <= cols; x++) { snakeCtx.beginPath(); snakeCtx.moveTo(x * cell, 0); snakeCtx.lineTo(x * cell, rows * cell); snakeCtx.stroke(); }
  for (let y = 0; y <= rows; y++) { snakeCtx.beginPath(); snakeCtx.moveTo(0, y * cell); snakeCtx.lineTo(cols * cell, y * cell); snakeCtx.stroke(); }
  snakeCtx.font = "18px serif";
  snakeCtx.textAlign = "center";
  snakeCtx.textBaseline = "middle";
  snakeCtx.fillText("🍎", state.snakeFood.x * cell + cell / 2, state.snakeFood.y * cell + cell / 2);
  state.snake.forEach((part, index) => {
    snakeCtx.fillStyle = index === 0 ? "#fbbf24" : "#99f6e4";
    snakeCtx.fillRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4);
  });
  snakeCtx.fillStyle = "rgba(255,255,255,.9)";
  snakeCtx.font = "13px 'Segoe UI', sans-serif";
  snakeCtx.textAlign = "left";
  snakeCtx.fillText("得分 " + state.snakeScore, 10, 16);
}
function snakeStep() {
  if (!state.snakeRunning) return;
  const head = state.snake[0];
  const next = { x: head.x + state.snakeDir.x, y: head.y + state.snakeDir.y };
  if (next.x < 0 || next.x >= 32 || next.y < 0 || next.y >= 10) { endSnake("撞墙了"); return; }
  if (state.snake.some((part) => part.x === next.x && part.y === next.y)) { endSnake("撞到自己了"); return; }
  state.snake.unshift(next);
  if (next.x === state.snakeFood.x && next.y === state.snakeFood.y) {
    state.snakeScore += 1;
    let food;
    do { food = { x: Math.floor(Math.random() * 32), y: Math.floor(Math.random() * 10) }; }
    while (state.snake.some((part) => part.x === food.x && part.y === food.y));
    state.snakeFood = food;
  } else {
    state.snake.pop();
  }
  drawSnake();
  if (state.snakeScore >= 20) { endSnake("20 分，通关"); return; }
  requestAnimationFrame(snakeLoop);
}
function snakeLoop(now) {
  if (!state.snakeRunning) return;
  if (!state.snakeLast) state.snakeLast = now;
  if (now - state.snakeLast >= state.snakeStep) {
    state.snakeLast = now;
    snakeStep();
  } else {
    requestAnimationFrame(snakeLoop);
  }
}
function startSnake() {
  if (state.snakeRunning) return;
  snakeReset();
  state.snakeRunning = true;
  document.getElementById("startSnake").disabled = true;
  setFeedback("snakeFeedback", "开始！方向键/WASD 或按钮控制。");
  requestAnimationFrame(snakeLoop);
}
function endSnake(reason) {
  if (!state.snakeRunning) return;
  state.snakeRunning = false;
  document.getElementById("startSnake").disabled = false;
  document.getElementById("startSnake").textContent = "再玩一局";
  state.lastSnakeResult = state.snakeScore + " 分";
  setFeedback("snakeFeedback", reason + "：本局 " + state.snakeScore + " 分。");
  setMood(5, "贪吃蛇拿了 <b>" + state.snakeScore + " 分</b>。休息一下，再去看岗位。");
}
function setSnakeDir(dir) {
  if (!state.snakeRunning) return;
  if (dir === "up" && state.snakeDir.y !== 1) state.snakeDir = { x: 0, y: -1 };
  if (dir === "down" && state.snakeDir.y !== -1) state.snakeDir = { x: 0, y: 1 };
  if (dir === "left" && state.snakeDir.x !== 1) state.snakeDir = { x: -1, y: 0 };
  if (dir === "right" && state.snakeDir.x !== -1) state.snakeDir = { x: 1, y: 0 };
}
document.getElementById("startSnake").addEventListener("click", startSnake);
document.querySelectorAll(".pad button").forEach((btn) => btn.addEventListener("click", () => setSnakeDir(btn.dataset.dir)));
document.addEventListener("keydown", (event) => {
  if (state.activePanel !== "snakePanel") return;
  const key = event.key.toLowerCase();
  if (["arrowup", "w"].includes(key)) { setSnakeDir("up"); event.preventDefault(); }
  if (["arrowdown", "s"].includes(key)) { setSnakeDir("down"); event.preventDefault(); }
  if (["arrowleft", "a"].includes(key)) { setSnakeDir("left"); event.preventDefault(); }
  if (["arrowright", "d"].includes(key)) { setSnakeDir("right"); event.preventDefault(); }
});

// 首屏渲染
snakeReset();
drawCatch();
</script>
</body>
