<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareerZone X 采集器</title>
  <style>
    body { width: 360px; margin: 0; padding: 14px; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; background: #fbfaf7; color: #0f172a; }
    h1 { font-size: 18px; margin: 0 0 2px; color: #0b3b3a; }
    .sub { font-size: 11px; color: #64748b; margin-bottom: 10px; }
    label { display: block; margin-top: 9px; font-size: 12px; font-weight: 700; color: #334155; }
    input { width: 100%; box-sizing: border-box; margin-top: 3px; padding: 7px 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 9px; background: #0f766e; color: #fff; font-weight: 700; cursor: pointer; }
    button:hover { background: #115e59; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    button.secondary:hover { background: #cbd5e1; }
    button.danger { background: #f3e7e5; color: #9a3d32; border: 1px solid #e5c7c1; }
    button.danger:hover { background: #ead7d3; }
    .status { margin-top: 10px; padding: 9px; border-radius: 9px; background: #f1f5f9; font-size: 12px; color: #334155; white-space: pre-wrap; min-height: 34px; }
    .ok { background: #ccfbf1; color: #115e59; }
    .err { background: #fee2e2; color: #991b1b; }
    .hint { font-size: 11px; color: #64748b; margin-top: 8px; }
    .toggle-row { display: flex; gap: 7px; align-items: center; margin-top: 10px; font-size: 12px; font-weight: 700; color: #334155; }
    .toggle-row input { width: auto; margin: 0; }
    .warn { font-size: 11px; color: #92400e; background: #fef3c7; padding: 7px; border-radius: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🐟 CareerZone X 采集器</h1>
  <div class="sub">只采集你当前打开的页面，点击才触发。</div>

  <label for="api">API 地址</label>
  <input id="api" value="http://127.0.0.1:8000" />

  <label for="site">网站地址（读取登录态用）</label>
  <input id="site" value="http://127.0.0.1:8501" />

  <label class="toggle-row">
    <input id="autoDetail" type="checkbox" />
    <span>浏览时自动补全当前可见 JD</span>
  </label>
  <div class="hint">只在你滚动/打开职位时读当前可见详情，不自动翻页、不自动点击。</div>

  <button id="save" class="secondary">保存设置</button>
  <button id="capture">采集当前页</button>
  <button id="clear" class="danger">清空本机职位库</button>
  <div id="status" class="status">API 地址填好即可；本机已关闭令牌校验。打开招聘页面后点采集。</div>

  <div class="warn">不会自动登录、翻页、破解验证码。清空会删除本机采集的职位，二次确认后不可撤销。</div>
  <div class="hint">支持：BOSS直聘 / 猎聘 / 智联 / 51JOB / 鱼泡。建议在职位详情页采集；列表页只抓卡片摘要。</div>

  <script src="popup.js"></script>
</body>
</html>
